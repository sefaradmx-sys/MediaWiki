name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack _bundle (pages + binary images) into root and docs/
        run: |
          if [ -d _bundle ]; then
            cat _bundle/p0* | base64 -d > /tmp/b.tgz
            sha256sum /tmp/b.tgz
            mkdir -p docs && tar xzf /tmp/b.tgz -C . && tar xzf /tmp/b.tgz -C docs
            touch .nojekyll docs/.nojekyll
            git rm -r -q _bundle
            git config user.name "github-actions[bot]"
            git config user.email "41898+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Biografías GS completas con retratos/escudos (desempaquetado)" || true
            git push
          fi
          ls -la docs/assets/retratos || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
